name: Sync to Codeberg

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Changes
        env:
          CB_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CB_USER: "ampmod-bot"
        run: |
          git remote add codeberg https://$CB_USER:$CB_TOKEN@codeberg.org/ampmod/ampmod.git
          
          git push codeberg develop || echo "probably nothing to do"